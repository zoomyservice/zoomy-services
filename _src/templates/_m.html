{% macro browser(src, url, alt, root, eager=False, w=1440, h=900) %}
<div class="frame">
  <div class="frame__bar"><span class="frame__dots"><i></i><i></i><i></i></span><span class="frame__url">{{ url }}</span></div>
  <img src="{{ root }}{{ src }}" alt="{{ alt }}" width="{{ w }}" height="{{ h }}"{% if not eager %} loading="lazy"{% else %} fetchpriority="high"{% endif %} decoding="async">
</div>
{% endmacro %}
{% macro phone(src, alt, root, w=600, h=1299) %}
<div class="phone"><img src="{{ root }}{{ src }}" alt="{{ alt }}" width="{{ w }}" height="{{ h }}" loading="lazy" decoding="async"></div>
{% endmacro %}
{% macro arrow() %}<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>{% endmacro %}
